title: apt-bundle
description: A declarative package manager for apt, inspired by Homebrew's brew bundle
url: https://apt-bundle.org
baseurl: ""

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .gitignore
  - testing.md


