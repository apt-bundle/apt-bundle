name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/terraform-apply.yml'

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./infra/cloudflare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          # Uncomment if using Terraform Cloud
          # cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Configure R2 Backend
        if: env.R2_BUCKET_NAME != ''
        run: |
          if [ -z "${{ secrets.R2_BUCKET_NAME }}" ]; then
            echo "Error: R2_BUCKET_NAME secret is empty or not set"
            exit 1
          fi
          cat > backend.hcl <<EOF
          bucket                      = "${{ secrets.R2_BUCKET_NAME }}"
          endpoint                    = "${{ secrets.R2_ENDPOINT }}"
          access_key                  = "${{ secrets.R2_ACCESS_KEY_ID }}"
          secret_key                  = "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          EOF
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Terraform Init
        id: init
        run: |
          if [ -f backend.hcl ]; then
            terraform init -backend-config=backend.hcl
          else
            echo "Error: backend.hcl not found. R2 backend secrets must be configured."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -var="cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false -var="cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Output
        id: output
        run: terraform output -json

      - name: Summary
        run: |
          echo "## Terraform Apply Successful ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### DNS Records Managed:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          terraform output -json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

